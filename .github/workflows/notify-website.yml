# Notify the marketing site to rebuild when a new desktop release ships.
#
# When a release is published in this repo, this fires a deploy hook on the
# Cloudflare Pages project so usetravis.com picks up the new version label
# and download URLs.
#
# Setup:
#   1. In Cloudflare dashboard:
#      Workers & Pages -> travis-website -> Settings -> Builds & deployments
#      -> Deploy hooks -> Add hook -> name "travis-releases"
#      Copy the URL.
#   2. In this repo:
#      Settings -> Secrets and variables -> Actions -> New repository secret
#      Name: PAGES_DEPLOY_HOOK   Value: <paste URL from step 1>

name: Notify website

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: POST Cloudflare Pages deploy hook
        env:
          HOOK: ${{ secrets.PAGES_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::PAGES_DEPLOY_HOOK secret is not set on this repo."
            exit 1
          fi
          curl -sS -X POST "$HOOK" \
            -H 'content-type: application/json' \
            -d "{\"reason\":\"release ${{ github.event.release.tag_name }}\"}"
